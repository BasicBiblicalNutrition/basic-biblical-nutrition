<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BBN Recipes - Cookbook</title>

<link rel="stylesheet" href="cookbook_styles.css">
</head>

<body>
<a class="skip" href="#book">Skip to recipe</a>
<div class="shell">

<header class="header">
  <div class="banner-brand">

    <img src="../images/Banner/logoOnly_2.png"
     alt="Basic Biblical Nutrition"
     class="banner-logo">

    <div class="banner-brand-text">
        <div class="banner-kicker">
            <span class="banner-kicker-green">BASIC<br>
            BIBLICAL</span><br>
            <span class="banner-kicker-brown">NUTRITION</span>
        </div>

        <h1>Healthy Recipes from the Heart</h1>
        <div style="font-style:italic;color:var(--olive-dark);font-size:1.05rem">Incredibly yummy health-conscious recipes from the BBN kitchen … Southern Style.</div>
        </div>
    </div>

  <div class="controls" aria-label="Flipbook controls">

  <button id="home" type="button" aria-label="Home" title="Home"
          onclick="window.location.href='../index.html'">
    <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20">
      <path fill="#5b3d18" d="M12 3 3 10.5V21h6v-6h6v6h6V10.5L12 3z"/>
    </svg>
  </button>

  <button id="prev" type="button">← Previous</button>
    <span id="status" class="status" aria-live="polite">
      Pages 1–2 of 4
    </span>
  <button id="next" type="button">Next →</button>

  <div class="dropdown more-menu">
  <a href="#" aria-haspopup="true" aria-expanded="false">
    <span class="burger-icon">🍔 </span>
  </a>

  <div id="moreMenu" class="dropdown-content" hidden>
    <ul>
        <li>
          <a href="#" id="print" onclick="printPDF(PRINT_PDF); return false;" 
            title="If running on MS Edge, PDF documents 
            may print in black and white. 
            Use Chrome for optimal printing.">
            <span class="print-icon">🖨️</span> Print
          </a>
        </li>

        <li>
          <a href="#" onclick="toggleLargeText(); return false;">
            <span id="textSizeIcon" class="icon">A+</span>
            <span id="textSizeLabel">Increase Text Size</span>
          </a>
        </li>

        <li>
          <a href="../contact.html">
            <span class="icon">✉</span> Contact Us
          </a>
        </li>
    </ul>
  </div>
</div>

</div>

</header>


<div class="reading-layout">
  <div id="tocContainer"></div>

  <main id="book" class="book-area" tabindex="-1" aria-label="BBN spiral recipe notebook">
  <div class="book-nav" aria-label="Recipe page navigation">
    <button class="book-arrow book-arrow-left" id="bookPrev" type="button"
      aria-label="Previous recipe pages" title="Previous pages">‹</button>
    <button class="book-arrow book-arrow-right" id="bookNext" type="button"
      aria-label="Next recipe pages" title="Next pages">›</button>
  </div>


  <div class="notebook" id="recipePages">
  </div>
</main>
</div>
</div>

<script src="../script_r7.js"></script>
<script src="cookbook.js"></script>
<script src="flipbook.js"></script>
<script src="pages.js"></script>

</body>
</html>
