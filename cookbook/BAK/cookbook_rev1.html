<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BBN Recipes — Sweet Gypsy Pepper & Chicken Soup</title>
<style>
:root{
  --olive:#596b28; --olive-dark:#43521e; --cream:#f5eedb; --paper:#fffdf3;
  --ink:#29261f; --muted:#6b624f; --line:#c8b98f; --cover:#596b28;
  --spiral:#34332e; --shadow:rgba(34,25,12,.34); --font-scale:1
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--ink)}
body{
  font-family:Georgia,"Times New Roman",serif;
  padding:0 24px 36px;
  background:
    linear-gradient(rgba(91,62,31,.08),rgba(91,62,31,.08)),
    repeating-linear-gradient(0deg,#9a7048 0,#a47b51 3px,#8d633e 6px,#a97d50 10px),
    linear-gradient(#9d734b,#6f4b2f);
}

button,select{font:inherit}
button,select{
  border:1px solid var(--olive);background:var(--cream);color:var(--ink);
  border-radius:5px;padding:8px 11px;cursor:pointer
}
button:hover,select:hover{background:#fffaf0}
button:focus-visible,select:focus-visible,.page:focus-visible{outline:3px solid #111;outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed}
.skip{position:absolute;left:-9999px}
.skip:focus{left:10px;top:10px;background:#fff;padding:8px;z-index:99}
.shell{max-width:1500px;margin:auto}
.header{
  display:grid;grid-template-columns:minmax(360px,1fr) auto;
  align-items:end;gap:24px;padding:8px 18px;
  background:linear-gradient(#fbf5e4,#efe4c6);
  border-bottom: none;
  box-shadow:0 5px 12px rgba(0,0,0,.18)
}
.brand{color:var(--olive);font-weight:bold;letter-spacing:.15em;font-size:.86rem}
.header h1{
      margin:.08em 0 0;
      font-size:clamp(2rem,4vw,3.0rem);
      line-height:.98}

.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.status{min-width:100px;text-align:center;font-size:.92rem}
.toolbar{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  padding:10px 20px 14px;
  background:#efe4c6
}
.toolbar label{font-weight:bold}

.reading-layout{
  display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:start;
  max-width:1450px;margin:18px auto 0
}
.toc-panel{
  background:linear-gradient(#f8f0dc,#eee3c5);border:1px solid #c5b68d;border-radius:14px;
  padding:14px 12px;box-shadow:0 8px 16px rgba(40,25,10,.25);position:sticky;top:14px
}
.toc-title{
  color:var(--ink);font-weight:bold;text-transform:uppercase;letter-spacing:.08em;
  font-size:1.02rem;text-align:center;padding:4px 7px 12px;border-bottom:1px solid var(--line);margin-bottom:7px
}
.toc-item{
  display:block;width:100%;text-align:left;border:0;border-bottom:1px solid rgba(203,189,155,.75);
  border-radius:0;background:transparent;padding:12px 8px;color:var(--ink);font-size:.94rem
}
.toc-item:last-child{border-bottom:0}
.toc-item:hover,.toc-item.selected{background:#e7e5bf;color:var(--olive-dark);font-weight:bold;border-radius:6px}

.book-area{position:relative;max-width:1220px;margin:auto;padding:0}
.notebook{
  position:relative;display:grid;grid-template-columns:1fr 1fr;min-height:760px;
  padding:0 12px;border-radius:22px;filter:drop-shadow(0 20px 18px var(--shadow));
  perspective:1800px;background:var(--cover)
}
.notebook::after{
  content:"";position:absolute;inset:7px;border-radius:17px;pointer-events:none;
  border:1px solid rgba(255,255,255,.3);z-index:1
}
.notebook::before{
  content:"";
  position:absolute;
  left:50%;
  top:8px;
  bottom:8px;
  width:8px;
  transform:translateX(-50%);
  background:linear-gradient(
    90deg,
    rgba(65,48,27,.16),
    rgba(255,255,255,.95) 42%,
    rgba(210,201,180,.78) 58%,
    rgba(65,48,27,.16)
  );
  border-left:1px solid rgba(95,76,45,.22);
  border-right:1px solid rgba(95,76,45,.18);
  box-shadow:0 0 7px rgba(60,45,25,.18);
  z-index:6;
  pointer-events:none;
}
.page{
  display:none;
  position:relative;background:
    radial-gradient(circle at 20% 15%,rgba(255,255,255,.7),transparent 30%),
    radial-gradient(circle at 80% 80%,rgba(170,140,75,.07),transparent 35%),
    var(--paper);
  border:1px solid var(--line);padding:34px 48px 42px;min-height:760px;
  overflow:auto;font-size:calc(1rem * var(--font-scale));line-height:1.34
}
.page.active{display:block !important}
.left-page{border-radius:15px 0 0 15px;padding-left:54px}
.right-page{border-radius:0 15px 15px 0;padding-right:54px}
.page::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,.32),transparent 12%,transparent 88%,rgba(120,90,30,.05))
}
.eyebrow{position:relative;color:var(--olive);font-weight:bold;letter-spacing:.1em;text-transform:uppercase;font-size:.8em}
.rule{position:relative;height:2px;background:var(--olive);width:72px;margin:10px 0 18px}
.recipe-photo{
  position:relative;display:block;width:min(100%,500px);height:auto;max-height:none;object-fit:contain;
  margin:0 auto 16px;border:1px solid var(--line);border-radius:8px;
  box-shadow:0 8px 14px rgba(38,29,15,.18)
}
.title{
  font-size:clamp(1.55rem,2.7vw,2.35rem);
  line-height:1.02;
  margin:.18em 0 .35em;
  text-align:center;
  color:#2d2a22
}
.kicker{font-style:italic;font-size:1.02em;line-height:1.2;text-align:center;margin:.45em 0}
.story{font-size:1em;line-height:1.25;margin:.9em 0;text-align:center}
.meta{display:grid;gap:3px;border-block:1px solid var(--line);padding:8px 0;margin:.9em 0;font-size:.82em}
.byline{color:var(--muted);font-size:.7em}
h2{color:var(--olive);font-size:1.5em;line-height:1.05;margin:.15em 0 .55em}
h3{color:var(--olive);line-height:1.05}
.ingredients,.directions,.snapshot{padding-left:1.25em}
.ingredients li{margin:.28em 0}
.qty{font-weight:bold;white-space:nowrap}.unit{font-style:italic}
.directions li{margin:.34em 0}
.small{font-size:.75em;color:var(--muted);font-weight:normal}
.nutrition{display:grid;grid-template-columns:1fr auto;border-top:1px solid var(--line)}
.nutrition dt,.nutrition dd{padding:6px 0;margin:0;border-bottom:1px solid var(--line)}
.nutrition dt{font-weight:bold}.nutrition dd{text-align:right}
.stars{letter-spacing:.12em}
.purpose{font-size:1.2em;font-style:italic;text-align:center;margin:1.5em 0}
.page.hidden{display:none}
.page.turning-next{animation:turnNext .48s ease}
.page.turning-prev{animation:turnPrev .48s ease}
@keyframes turnNext{0%{transform:rotateY(0);transform-origin:left center}100%{transform:rotateY(-10deg)}}
@keyframes turnPrev{0%{transform:rotateY(0);transform-origin:right center}100%{transform:rotateY(10deg)}}

.book-nav{position:absolute;inset:0;z-index:20;pointer-events:none}
.book-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  width:48px;height:48px;border-radius:50%;
  border:2px solid rgba(255,255,255,.85);
  background:var(--olive);
  color:#fff;font:700 38px/38px Georgia,serif;
  display:grid;place-items:center;
  padding:0 0 4px;cursor:pointer;
  box-shadow:0 4px 10px rgba(38,29,15,.30);
  pointer-events:auto;
  transition:transform .18s ease,opacity .18s ease,box-shadow .18s ease;
}
.book-arrow:hover{
  transform:translateY(-50%) scale(1.08);
  box-shadow:0 6px 14px rgba(38,29,15,.38);
}
.book-arrow:focus-visible{
  outline:3px solid #fff;
  outline-offset:3px;
}
.book-arrow-left{left:-24px}
.book-arrow-right{right:-24px}
.book-arrow:disabled{opacity:.28;cursor:default}
.book-arrow:disabled:hover{
  transform:translateY(-50%);
  box-shadow:0 4px 10px rgba(38,29,15,.30)
}

/* Page-turn motion: the new spread arrives with a gentle 3-D turn,
   while the notebook gives a tiny physical-book movement. */
.notebook.flip-next{animation:bookFlipNext .52s ease both}
.notebook.flip-prev{animation:bookFlipPrev .52s ease both}
.page.flip-in-next{animation:pageFlipInNext .52s ease both}
.page.flip-in-prev{animation:pageFlipInPrev .52s ease both}

@keyframes bookFlipNext{
  0%{transform:translateX(0);filter:drop-shadow(0 20px 18px var(--shadow))}
  45%{transform:translateX(-8px) rotateY(-1.5deg);filter:drop-shadow(10px 22px 20px var(--shadow))}
  100%{transform:translateX(0);filter:drop-shadow(0 20px 18px var(--shadow))}
}
@keyframes bookFlipPrev{
  0%{transform:translateX(0);filter:drop-shadow(0 20px 18px var(--shadow))}
  45%{transform:translateX(8px) rotateY(1.5deg);filter:drop-shadow(-10px 22px 20px var(--shadow))}
  100%{transform:translateX(0);filter:drop-shadow(0 20px 18px var(--shadow))}
}
@keyframes pageFlipInNext{
  0%{opacity:.35;transform:perspective(1200px) rotateY(-9deg) translateX(18px)}
  100%{opacity:1;transform:perspective(1200px) rotateY(0) translateX(0)}
}
@keyframes pageFlipInPrev{
  0%{opacity:.35;transform:perspective(1200px) rotateY(9deg) translateX(-18px)}
  100%{opacity:1;transform:perspective(1200px) rotateY(0) translateX(0)}
}

@media(max-width:1000px){
  .reading-layout{grid-template-columns:180px minmax(0,1fr)}
  .header{grid-template-columns:1fr}
  .controls{justify-content:flex-start}
}
@media(max-width:780px){
  .toc-panel{display:none}.reading-layout{display:block}
  .book-arrow{width:42px;height:42px;font-size:34px;line-height:34px}
  .book-arrow-left{left:6px}
  .book-arrow-right{right:6px}
  body{padding:0 8px 20px}.header{padding:14px 12px 10px}
  .toolbar{justify-content:flex-start;padding:8px 12px}
  .notebook{display:block;min-height:0;padding:0 5px}
  .page{display:none;min-height:0;border-radius:12px!important;padding:25px}
  .page.active{display:block}
  .notebook::before{left:50%;width:24px}
  .spiral{left:50%;width:34px;top:15px;bottom:15px}
  .spiral i{width:32px;height:11px;border-width:3px}
}
@media print{
  body{background:#fff;padding:0}
  .header,.toolbar,.skip,.spiral,.wire-entry,.page-holes,.notebook::before,.toc-panel,.notebook::after{display:none!important}
  .book-area{padding:0}.notebook{display:block;filter:none;background:none}
  .page{display:block!important;border:0;min-height:auto;page-break-after:always;font-size:calc(1rem * var(--font-scale))}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .book-arrow:hover,.book-arrow:disabled:hover{transform:translateY(-50%)}
}
</style>
<style>
/* V21: banner logo only */
.header .banner-logo{
  width:68px;
  height:68px;
  object-fit:contain;
  flex:0 0 68px;
  display:block;
}
</style>

<body>
<a class="skip" href="#book">Skip to recipe</a>
<div class="shell">

<header class="header">
  <div class="banner-brand">

    <img src="../images/Banner/logoOnly_2.png"
     alt="Basic Biblical Nutrition"
     class="banner-logo">

    <div class="banner-brand-text">
      <div class="banner-kicker">
            <span class="banner-kicker-green">BASIC<br>
            BIBLICAL</span><br>
            <span class="banner-kicker-brown">NUTRITION</span>
        </div>

      <h1>Healthy Recipes from the Heart</h1>
      <div style="font-style:italic;color:var(--olive-dark);font-size:1.05rem">Incredibly yummy health-conscious recipes from the BBN kitchen … Southern Style.</div>
    </div>
  </div>



  <div class="controls" aria-label="Flipbook controls">

<button id="home" type="button" aria-label="Home" title="Home"
        onclick="window.location.href='../index.html'">
  <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20">
    <path fill="#5b3d18" d="M12 3 3 10.5V21h6v-6h6v6h6V10.5L12 3z"/>
  </svg>
</button>

  <button id="prev" type="button">← Previous</button>

  <span id="status" class="status" aria-live="polite">
    Pages 1–2 of 5
  </span>

  <button id="next" type="button">Next →</button>



  <div class="dropdown more-menu">
  <a href="#" aria-haspopup="true" aria-expanded="false">
    <span class="burger-icon">🍔 </span>
  </a>

  <div id="moreMenu" class="dropdown-content" hidden>

    <ul>

      <li>
        <a href="#" id="print">
          <span class="print-icon">🖨️</span> Print
        </a>
      </li>

      <li>
        <a href="#" onclick="toggleLargeText(); return false;">
          <span id="textSizeIcon" class="icon">A+</span>
          <span id="textSizeLabel">Increase Text Size</span>
        </a>
      </li>

      <li>
        <a href="#">
          <span class="icon">✉</span> Contact Us
        </a>
      </li>

    </ul>
  </div>
</div>

   </div>

  </header>




<div class="reading-layout">
  <aside class="toc-panel" aria-label="Table of Contents">
    <div class="toc-title">Table of Contents</div>
    <button type="button" class="toc-item selected" data-jump="0">Opening</button>
    <button type="button" class="toc-item" data-jump="1">Ingredients &amp; Directions</button>
    <button type="button" class="toc-item" data-jump="2">Directions Continued</button>
    <button type="button" class="toc-item" data-jump="3">Nutrition</button>
    <button type="button" class="toc-item" data-jump="4">Functional Nutrition Snapshot</button>
  </aside>

  <main id="book" class="book-area" tabindex="-1" aria-label="BBN spiral recipe notebook">
  <div class="book-nav" aria-label="Recipe page navigation">
    <button class="book-arrow book-arrow-left" id="bookPrev" type="button"
      aria-label="Previous recipe pages" title="Previous pages">‹</button>
    <button class="book-arrow book-arrow-right" id="bookNext" type="button"
      aria-label="Next recipe pages" title="Next pages">›</button>
  </div>


  <div class="notebook" id="recipePages">
  </div>
</main>
</div>
</div>

<script>
  
let pages=[];

fetch('pages.html')
  .then(response => response.text())
  .then(html => {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const sourcePages = [...doc.querySelectorAll('.page')];

    const container = document.getElementById('recipePages');

    sourcePages.forEach(page => {
      container.appendChild(page);
    });

    pages = [...container.querySelectorAll('.page')];

    render(0,"",false);
  });





const notebook=document.querySelector('.notebook');
const prev=document.getElementById('prev');
const next=document.getElementById('next');
const bookPrev=document.getElementById('bookPrev');
const bookNext=document.getElementById('bookNext');
const status=document.getElementById('status');
const fontSize=document.getElementById('fontSize');
const book=document.getElementById('book');

let index=0;
let animationTimer=null;

function desktop(){
  return window.innerWidth>780;
}

function spreadStart(pageIndex){
  return desktop() ? Math.floor(pageIndex/2)*2 : pageIndex;
}

function render(pageIndex, direction="", animate=true){
  const target=Math.max(0,Math.min(pageIndex,pages.length-1));
  index=target;
  const startPage=spreadStart(target);

  pages.forEach(p=>p.classList.remove(
    'active','flip-in-next','flip-in-prev'
  ));

  pages[startPage]?.classList.add('active');
  if(desktop() && pages[startPage+1]){
    pages[startPage+1].classList.add('active');
  }

  const endPage=desktop()
    ? Math.min(startPage+2,pages.length)
    : startPage+1;

  status.textContent=`Pages ${startPage+1}–${endPage} of ${pages.length}`;

  const atBeginning=startPage===0;
  const atEnd=endPage>=pages.length;

  prev.disabled=atBeginning;
  next.disabled=atEnd;
  bookPrev.disabled=atBeginning;
  bookNext.disabled=atEnd;

  document.querySelectorAll('.toc-item').forEach(btn=>{
    const jump=Number(btn.dataset.jump);
    btn.classList.toggle('selected',
      jump===target || (jump>=startPage && jump<endPage)
    );
  });

  if(animate && direction && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    notebook.classList.remove('flip-next','flip-prev');
    void notebook.offsetWidth;
    notebook.classList.add(direction==='next' ? 'flip-next' : 'flip-prev');

    pages[startPage]?.classList.add(
      direction==='next' ? 'flip-in-next' : 'flip-in-prev'
    );
    if(desktop() && pages[startPage+1]){
      pages[startPage+1].classList.add(
        direction==='next' ? 'flip-in-next' : 'flip-in-prev'
      );
    }

    clearTimeout(animationTimer);
    animationTimer=setTimeout(()=>{
      notebook.classList.remove('flip-next','flip-prev');
      pages.forEach(p=>p.classList.remove('flip-in-next','flip-in-prev'));
    },540);
  }

  book.setAttribute('aria-label',
    `BBN recipe pages ${startPage+1} through ${endPage}`
  );
}

function goNext(){
  const target=desktop()
    ? Math.min(index + 2,pages.length-1)
    : Math.min(index + 1,pages.length-1);
  render(target,'next');
}

function goPrev(){
  const target=desktop()
    ? Math.max(spreadStart(index)-2,0)
    : Math.max(index-1,0);
  render(target,'prev');
}

prev.addEventListener('click',goPrev);
next.addEventListener('click',goNext);
bookPrev.addEventListener('click',goPrev);
bookNext.addEventListener('click',goNext);

document.querySelectorAll('.toc-item').forEach(btn=>{
  btn.addEventListener('click',()=>{
    render(Number(btn.dataset.jump));
    book.focus({preventScroll:true});
  });
});

if(fontSize){
  fontSize.addEventListener('change',e=>{
    document.documentElement.style.setProperty('--font-scale',e.target.value);
  });
}

const printButton=document.getElementById('print');
if(printButton){
  printButton.addEventListener('click',e=>{
    e.preventDefault();
    window.print();
  });
}

/* More / burger menu */
const moreMenu=document.getElementById('moreMenu');
const moreTrigger=document.querySelector('.more-menu > a');

if(moreMenu && moreTrigger){
  moreTrigger.addEventListener('click',e=>{
    e.preventDefault();
    const isOpen=!moreMenu.hasAttribute('hidden');

    if(isOpen){
      moreMenu.setAttribute('hidden','');
      moreTrigger.setAttribute('aria-expanded','false');
    }else{
      moreMenu.removeAttribute('hidden');
      moreTrigger.setAttribute('aria-expanded','true');
    }
  });

  document.addEventListener('click',e=>{
    if(!e.target.closest('.more-menu')){
      moreMenu.setAttribute('hidden','');
      moreTrigger.setAttribute('aria-expanded','false');
    }
  });

  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      moreMenu.setAttribute('hidden','');
      moreTrigger.setAttribute('aria-expanded','false');
    }
  });
}

window.addEventListener('resize',()=>{
  render(index,"",false);
});

window.addEventListener('keydown',e=>{
  if(e.target.matches('select,button,input,textarea')) return;

  if(e.key==='ArrowRight'){
    e.preventDefault();
    goNext();
  }else if(e.key==='ArrowLeft'){
    e.preventDefault();
    goPrev();
  }
});

render(0,"",false);
</script>

<script src="flipbook.js"></script>
</body>
</html>
