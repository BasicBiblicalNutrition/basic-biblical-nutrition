<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<link rel="stylesheet" href="styles_r7.css">
<link rel="stylesheet" href="contact.css">
</head>

<body>

<div id="site-banner"></div>


<section class="contact-section">

    <h2>Contact</h2>

    <form id="contact-form" action="https://api.web3forms.com/submit" method="POST" class="contact-form">

        <input type="hidden" name="access_key" value="723b6c85-a00d-474d-9828-2f26524f114a">
        <input type="hidden" name="redirect" 
               value="https://basicbiblicalnutrition.github.io/basic-biblical-nutrition/contact_thankYou.html">

        <label for="contact-from">From:</label>
        <input
            type="email"
            id="contact-from"
            name="email"
            required
            pattern="[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}"

            title="Please enter a valid email address."
        >

        <label for="mailing-list">Would you like to be added to our mailing list?</label>
        <select id="mailing-list" name="mailing_list" required>
            <option value="">Please select</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>

       <label for="contact-subject">Subject:</label>
        <input
            type="text"
            id="contact-subject"
            name="subject"
            required
        >

        <label for="contact-body">Body:</label>
        <textarea
            id="contact-body"
            name="message"
            rows="8"
            required
        ></textarea>

        <div class="h-captcha" data-captcha="true"></div>

        <button type="submit" class="pill-button">
            Send
        </button>



</form>

</section>


<div id="site-footer"></div>

<script src="script_r7.js"></script>
<script src="bbn_tooltips.js"></script>
<script src="components.js"></script>
<script type="module" src="./js/contact.js"></script>

<script src="https://web3forms.com/client/script.js" async defer></script>

<script>
const form = document.getElementById('contact-form');
const subjectField = document.getElementById('contact-subject');

const params = new URLSearchParams(window.location.search);
const prefix = params.get('subject') || '';

subjectField.value = prefix;

subjectField.addEventListener('input', function () {
    if (!this.value.startsWith(prefix)) {
        this.value = prefix;
    }

    const addedText = this.value.substring(prefix.length);

    if (addedText.length > 50) {
        this.value = prefix + addedText.substring(0, 50);
    }
});

form.addEventListener('submit', function(e) {

    const hCaptcha = form.querySelector('textarea[name=h-captcha-response]').value;

    if (!hCaptcha) {
        e.preventDefault();
        alert("Please fill out captcha field");
        return;
    }
});
</script>

</body>
</html>
