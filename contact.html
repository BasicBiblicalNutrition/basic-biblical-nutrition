<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<link rel="stylesheet" href="styles_r7.css">
<link rel="stylesheet" href="contact.css">
</head>

<body>

<div id="site-banner"></div>


<section class="contact-section">

    <h2>Contact</h2>

    <form action="https://api.web3forms.com/submit" method="POST" class="contact-form">

        <input type="hidden" name="access_key" value="723b6c85-a00d-474d-9828-2f26524f114a">

        <label for="contact-from">From:</label>
        <input
            type="email"
            id="contact-from"
            name="email"
            required
        >

        <label for="contact-subject">Subject:</label>
        <input
            type="text"
            id="contact-subject"
            name="subject"
            required
        >

        <label for="contact-body">Body:</label>
        <textarea
            id="contact-body"
            name="message"
            rows="8"
            required
        ></textarea>

        <div class="h-captcha" data-captcha="true"></div>

        <button type="submit" class="pill-button">
            Send
        </button>



</form>

</section>


<div id="site-footer"></div>

<script src="script_r7.js"></script>
<script src="bbn_tooltips.js"></script>
<script src="components.js"></script>

<script src="https://web3forms.com/client/script.js" async defer></script>

<script>
const form = document.getElementById('contact-form');

form.addEventListener('submit', function(e) {

    const hCaptcha = form.querySelector('textarea[name=h-captcha-response]').value;

    if (!hCaptcha) {
        e.preventDefault();
        alert("Please fill out captcha field");
        return;
    }
});
</script>

</body>
</html>
